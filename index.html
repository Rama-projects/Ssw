<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Bahasa Jepang - Dark Mode</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="quiz-container">
        <h2>Kuis Bahasa Jepang</h2>
        
        <div id="quiz">
            <div id="question-container"></div>
            <div class="options" id="options-container"></div>
            <button class="btn" id="next-btn" onclick="nextQuestion()">Selanjutnya</button>
        </div>

        <div id="result" class="result-container hidden"></div>
    </div>

    <!-- Memanggil data soal -->
    <script src="soal.js"></script>

    <script>
        // Kamus mini pintar bawaan untuk kata-kata umum yang sering keluar di soal Anda
        // Jadi langsung diterjemahkan secara instan tanpa download file besar!
        const customDict = {
            "安全": "あんぜん",
            "食品": "しょくひん",
            "作": "つく",
            "売": "う",
            "会社": "かいしゃ",
            "信用": "しんよう",
            "病気": "びょうき",
            "商品": "しょうみん",
            "給料": "きゅうりょう",
            "下": "さ",
            "学校": "がっこう",
            "行": "い"
        };

        // Fungsi otomatis mendeteksi kanji berdasarkan kamus mini instan
        function autoFurigana(text) {
            let result = text;
            for (let kanji in customDict) {
                let rubyTag = `<ruby>${kanji}<rt>${customDict[kanji]}</rt></ruby>`;
                let regex = new RegExp(kanji, "g");
                result = result.replace(regex, rubyTag);
            }
            return result;
        }

        let currentQuestionIndex = 0;
        let score = 0;

        const questionContainer = document.getElementById("question-container");
        const optionsContainer = document.getElementById("options-container");
        const resultContainer = document.getElementById("result");
        const quizBox = document.getElementById("quiz");

        function loadQuiz() {
            optionsContainer.innerHTML = "";
            const currentQuiz = quizData[currentQuestionIndex];
            
            const parsedQuestion = autoFurigana(currentQuiz.question);
            questionContainer.innerHTML = `<div class="question">Pertanyaan ${currentQuestionIndex + 1} dari ${quizData.length}:<br><strong>${parsedQuestion}</strong></div>`;

            currentQuiz.options.forEach((option, index) => {
                const parsedOption = autoFurigana(option);
                const label = document.createElement("label");
                label.classList.add("option-label");
                label.innerHTML = `
                    <input type="radio" name="answer" value="${index}">
                    <span>${parsedOption}</span>
                `;
                optionsContainer.appendChild(label);
            });
        }

        function nextQuestion() {
            const selectedOptions = document.querySelectorAll('input[name="answer"]:checked');
            
            if (selectedOptions.length === 0) {
                alert("Silakan pilih salah satu jawaban terlebih dahulu!");
                return;
            }

            const userAnswer = parseInt(selectedOptions[0].value);

            if (userAnswer === quizData[currentQuestionIndex].answer) {
                score++;
            }

            currentQuestionIndex++;

            if (currentQuestionIndex < quizData.length) {
                loadQuiz();
            } else {
                quizBox.classList.add("hidden");
                resultContainer.classList.remove("hidden");
                resultContainer.innerHTML = `Kuis Selesai! 🎉<br>Skor Anda: ${score} dari ${quizData.length}`;
            }
        }

        // Langsung buka tanpa loading sama sekali!
        loadQuiz();
    </script>

</body>
</html>
