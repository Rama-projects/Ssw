<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi Ujian SSW Pengolahan Makanan</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .quiz-image {
            max-width: 100%;
            height: auto;
            max-height: 220px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: block;
            margin-left: auto;
            margin-right: auto;
            border: 1px solid #333;
        }
        .option-content {
            display: flex;
            flex-direction: column;
            width: 100%;
        }
        .option-img {
            max-width: 120px;
            height: auto;
            border-radius: 4px;
            margin-top: 8px;
            border: 1px solid #444;
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <!-- Menu Pilih Sesi -->
        <div id="session-menu">
            <h2>Simulasi Ujian SSW Pengolahan Makanan</h2>
            <div class="session-grid" id="session-list"></div>
        </div>

        <!-- Tampilan Kuis -->
        <div id="quiz-box" class="hidden">
            <div class="header-info">
                <h3 id="session-title" style="margin:0; font-size: 1rem;"></h3>
                <div class="timer" id="timer-display">⏱️ 60:00</div>
            </div>
            <div id="question-container"></div>
            <div class="options" id="options-container"></div>
            
            <!-- Area Tombol Navigasi -->
            <div class="nav-buttons">
                <button class="btn btn-secondary hidden" id="prev-btn" onclick="prevQuestion()">Sebelumnya</button>
                <button class="btn" id="next-btn" onclick="nextQuestion()">Selanjutnya</button>
            </div>
        </div>

        <!-- Tombol Menuju Lihat Skor -->
        <div id="score-prompt-box" class="hidden" style="text-align: center;">
            <h3>Ujian Selesai!</h3>
            <p style="color: #bbb; margin-bottom: 25px;">Anda telah menjawab semua soal dalam sesi ini. Silakan klik tombol di bawah untuk melihat hasil penilaian Anda.</p>
            <button class="btn" onclick="displayResult()">Lihat Skor</button>
        </div>

        <!-- Tampilan Hasil Skor & Kelulusan -->
        <div id="result-box" class="result-container hidden"></div>
    </div>

    <script src="soal.js"></script>
    <script src="soal-sesi3-4.js"></script>
    <script src="soal-sesi5-7.js"></script>

    <script>
        function parseFurigana(text) {
            if (!text) return "";
            let parsed = text.replace(/([一-龯々〆ヵヶ]+)(?:\[(.*?)\])/g, '<ruby>$1<rt>$2</rt></ruby>');
            parsed = parsed.replace(/([\u4e00-\u9faf]+)(?:\[(.*?)\])/g, '<ruby>$1<rt>$2</rt></ruby>');
            return parsed;
        }

        let currentSessionKey = "";
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let timerInterval;
        let timeLeft = 0;
        
        let userAnswers = {};

        const sessionMenu = document.getElementById("session-menu");
        const sessionList = document.getElementById("session-list");
        const quizBox = document.getElementById("quiz-box");
        const sessionTitle = document.getElementById("session-title");
        const questionContainer = document.getElementById("question-container");
        const optionsContainer = document.getElementById("options-container");
        const prevBtn = document.getElementById("prev-btn");
        const nextBtn = document.getElementById("next-btn");
        const scorePromptBox = document.getElementById("score-prompt-box");
        const resultBox = document.getElementById("result-box");
        const timerDisplay = document.getElementById("timer-display");

        function initMenu() {
            sessionList.innerHTML = "";
            for (let key in sessionsData) {
                const btn = document.createElement("button");
                btn.classList.add("session-btn");
                btn.innerHTML = `${sessionsData[key].title} <br><small style="color: #888; font-weight: normal;">(${sessionsData[key].questions.length} Soal)</small>`;
                btn.onclick = () => startSession(key);
                sessionList.appendChild(btn);
            }
        }

        function startSession(key) {
            currentSessionKey = key;
            currentQuestions = sessionsData[key].questions;
            currentQuestionIndex = 0;
            score = 0;
            timeLeft = sessionsData[key].timeLimit;
            userAnswers = {}; 

            sessionMenu.classList.add("hidden");
            quizBox.classList.remove("hidden");
            sessionTitle.innerText = sessionsData[key].title;
            
            startTimer();
            loadQuiz();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    alert("Waktu ujian telah habis!");
                    finishQuiz();
                } else {
                    let minutes = Math.floor(timeLeft / 60);
                    let seconds = timeLeft % 60;
                    timerDisplay.innerText = `⏱️ ${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                    timeLeft--;
                }
            }, 1000);
        }

        function loadQuiz() {
            optionsContainer.innerHTML = "";
            const currentQuiz = currentQuestions[currentQuestionIndex];
            
            const parsedQuestion = parseFurigana(currentQuiz.question);
            
            if (currentQuestionIndex === 0) {
                prevBtn.classList.add("hidden");
            } else {
                prevBtn.classList.remove("hidden");
            }

            if (currentQuestionIndex === currentQuestions.length - 1) {
                nextBtn.innerText = "Selesai";
            } else {
                nextBtn.innerText = "Selanjutnya";
            }
            
            let imageHTML = "";
            if (currentQuiz.image) {
                imageHTML = `<img src="${currentQuiz.image}" alt="Gambar Soal" class="quiz-image">`;
            }

            questionContainer.innerHTML = `
                <div class="question">
                    Soal ${currentQuestionIndex + 1} dari ${currentQuestions.length}:<br><br>
                    ${imageHTML}
                    <strong>${parsedQuestion}</strong>
                </div>
            `;

            currentQuiz.options.forEach((option, index) => {
                const parsedOption = parseFurigana(option);
                
                let optImageHTML = "";
                if (currentQuiz.optionImages && currentQuiz.optionImages[index]) {
                    optImageHTML = `<img src="${currentQuiz.optionImages[index]}" alt="Opsi Gambar" class="option-img">`;
                }

                const label = document.createElement("label");
                label.classList.add("option-label");
                
                let checkedAttr = "";
                if (userAnswers[currentQuestionIndex] === index) {
                    checkedAttr = "checked";
                }

                label.innerHTML = `
                    <input type="radio" name="answer" value="${index}" ${checkedAttr}>
                    <div class="option-content">
                        <span>${parsedOption}</span>
                        ${optImageHTML}
                    </div>
                `;
                optionsContainer.appendChild(label);
            });
        }

        function saveCurrentAnswer() {
            const selectedOptions = document.querySelectorAll('input[name="answer"]:checked');
            if (selectedOptions.length > 0) {
                userAnswers[currentQuestionIndex] = parseInt(selectedOptions[0].value);
            } else {
                delete userAnswers[currentQuestionIndex]; 
            }
        }

        function nextQuestion() {
            const selectedOptions = document.querySelectorAll('input[name="answer"]:checked');
            
            if (selectedOptions.length === 0) {
                alert("Silakan pilih salah satu jawaban terlebih dahulu!");
                return;
            }

            saveCurrentAnswer();
            currentQuestionIndex++;

            if (currentQuestionIndex < currentQuestions.length) {
                loadQuiz();
            } else {
                calculateFinalScore();
                finishQuiz();
            }
        }

        function prevQuestion() {
            saveCurrentAnswer();

            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuiz();
            }
        }

        function calculateFinalScore() {
            score = 0;
            for (let i = 0; i < currentQuestions.length; i++) {
                if (userAnswers[i] === currentQuestions[i].answer) {
                    score++;
                }
            }
        }

        function finishQuiz() {
            clearInterval(timerInterval);
            quizBox.classList.add("hidden");
            scorePromptBox.classList.remove("hidden");
        }

        function displayResult() {
            scorePromptBox.classList.add("hidden");
            resultBox.classList.remove("hidden");

            let totalSoal = currentQuestions.length;
            let bobotPerSoal = 150 / totalSoal;
            let finalScore = Math.round(score * bobotPerSoal);
            let isPassed = finalScore >= 98;

            let scoreColor = isPassed ? "#2ecc71" : "#e74c3c";
            let statusBadge = isPassed 
                ? '<span class="badge-pass">LULUS (合格) 🎉</span>' 
                : '<span class="badge-fail">TIDAK LULUS (不合格) ❌</span>';

            // Bagian Review Soal Memanjang ke Bawah
            let reviewHTML = "<h3>Review Jawaban Anda:</h3><div class='review-container'>";

            currentQuestions.forEach((q, index) => {
                let userAns = userAnswers[index];
                let correctAns = q.answer;
                let isCorrect = (userAns === correctAns);

                let userAnsText = (userAns !== undefined && userAns !== null) ? parseFurigana(q.options[userAns]) : "Tidak dijawab";
                let correctAnsText = parseFurigana(q.options[correctAns]);
                let parsedQText = parseFurigana(q.question);

                let statusClass = isCorrect ? "correct" : "incorrect";
                let statusText = isCorrect ? "✅ Benar" : "❌ Salah";

                reviewHTML += `
                    <div class="review-item ${statusClass}">
                        <div class="review-question">Soal ${index + 1}: ${parsedQText}</div>
                        <div class="review-answer"><b>Status:</b> ${statusText}</div>
                        <div class="review-answer"><b>Jawaban Anda:</b> ${userAnsText}</div>
                        ${!isCorrect ? `<div class="review-answer"><b>Jawaban yang Benar:</b> ${correctAnsText}</div>` : ""}
                    </div>
                `;
            });

            reviewHTML += "</div>";

            resultBox.innerHTML = `
                <h2>Hasil Ujian SSW</h2>
                <p>Jawaban Benar: ${score} dari ${totalSoal} soal</p>
                <p>Total Nilai Anda: <strong style="color: ${scoreColor}; font-size: 1.4rem;">${finalScore}</strong> / 150</p>
                <p>Minimal Kelulusan: <strong>98</strong></p>
                <p>Status: ${statusBadge}</p>
                <br>
                ${reviewHTML}
                <br>
                <button class="btn home-btn" onclick="location.reload()">
                    🏠 Kembali ke Menu Utama
                </button>
            `;
        }

        initMenu();
    </script>
</body>
</html>
