<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Bahasa Jepang - Furigana</title>
    <!-- Memanggil file CSS eksternal -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="quiz-container">
        <h2>Kuis Bahasa Jepang (JLPT Style)</h2>
        
        <div id="quiz">
            <div id="question-container"></div>
            <div class="options" id="options-container"></div>
            <button class="btn" id="next-btn" onclick="nextQuestion()">Selanjutnya</button>
        </div>

        <div id="result" class="result-container hidden"></div>
    </div>

    <!-- Memanggil file data soal terpisah -->
    <script src="soal.js"></script>

    <!-- Logika Kuis -->
    <script>
        let currentQuestionIndex = 0;
        let score = 0;

        const questionContainer = document.getElementById("question-container");
        const optionsContainer = document.getElementById("options-container");
        const nextButton = document.getElementById("next-btn");
        const resultContainer = document.getElementById("result");
        const quizBox = document.getElementById("quiz");

        function loadQuiz() {
            optionsContainer.innerHTML = "";
            const currentQuiz = quizData[currentQuestionIndex];
            
            questionContainer.innerHTML = `<div class="question">Pertanyaan ${currentQuestionIndex + 1} dari ${quizData.length}:<br><strong>${currentQuiz.question}</strong></div>`;

            currentQuiz.options.forEach((option, index) => {
                const label = document.createElement("label");
                label.classList.add("option-label");
                label.innerHTML = `
                    <input type="radio" name="answer" value="${index}">
                    <span>${option}</span>
                `;
                optionsContainer.appendChild(label);
            });
        }

        function nextQuestion() {
            const selectedOptions = document.querySelectorAll('input[name="answer"]:checked');
            
            if (selectedOptions.length === 0) {
                alert("Silakan pilih salah satu jawaban terlebih dahulu!");
                return;
            }

            const userAnswer = parseInt(selectedOptions[0].value);

            if (userAnswer === quizData[currentQuestionIndex].answer) {
                score++;
            }

            currentQuestionIndex++;

            if (currentQuestionIndex < quizData.length) {
                loadQuiz();
            } else {
                quizBox.classList.add("hidden");
                resultContainer.classList.remove("hidden");
                resultContainer.innerHTML = `Kuis Selesai! 🎉<br>Skor Anda: ${score} dari ${quizData.length}`;
            }
        }

        // Jalankan kuis saat pertama kali dibuka
        loadQuiz();
    </script>

</body>
</html>
